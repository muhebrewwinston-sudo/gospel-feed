name: Repair KJV Photo Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-kjv-photo-upgrade
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and verify the upgrade
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            "https://tmpfiles.org/dl/1793450475.e8d86c991dbe1bc1/wgA3Tz9E6e6X/gospel-feed-photo-upgrade.zip" \
            --output /tmp/gospel-feed-photo-upgrade.zip
          echo "6019b16555861b74ce854bf4d6ab7b085e5251684c168a0360e9a5c20fad2797  /tmp/gospel-feed-photo-upgrade.zip" | sha256sum --check -

      - name: Install files and remove temporary instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          with ZipFile('/tmp/gospel-feed-photo-upgrade.zip') as archive:
              for member in archive.infolist():
                  target = (root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'Unsafe archive path: {member.filename}')
              archive.extractall(root)

          instructions = root / 'UPGRADE_INSTRUCTIONS.md'
          if instructions.exists():
              instructions.unlink()
          PY

      - name: Test the complete upgrade
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          python -m unittest discover -s tests -v
          POSTER_DRY_RUN=true python five_hour.py

      - name: Commit the repaired repository and remove this installer
        run: |
          rm -f .github/workflows/repair-photo-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install and test KJV verse-card photo upgrade"
          git push origin main
