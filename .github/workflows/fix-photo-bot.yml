          if actual != expected:
              raise RuntimeError('Embedded upgrade failed its integrity check')

          root = Path.cwd().resolve()
          with ZipFile(io.BytesIO(payload)) as archive:
              for member in archive.infolist():
                  target = (root / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'Unsafe archive path: {member.filename}')
              archive.extractall(root)

          (root / 'UPGRADE_INSTRUCTIONS.md').unlink(missing_ok=True)
          print('Embedded upgrade restored and verified.')
          PY

      - name: Restore the licensed local fonts
        run: |
          mkdir -p assets/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf assets/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf assets/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf assets/fonts/
          cp /usr/share/doc/fonts-dejavu-core/copyright assets/fonts/LICENSE.txt

      - name: Test the complete upgrade
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          python -m unittest discover -s tests -v
          POSTER_DRY_RUN=true python five_hour.py

      - name: Commit the repaired repository and remove this installer
        run: |
          rm -f .github/workflows/repair-photo-upgrade.yml .github/workflows/fix-photo-bot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install and test KJV verse-card photo upgrade"
          git push origin main
