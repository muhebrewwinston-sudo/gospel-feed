name: Diagnose Facebook Visibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Facebook visibility
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import os
          import requests

          page_id = os.environ['FACEBOOK_PAGE_ID']
          token = os.environ['FACEBOOK_ACCESS_TOKEN']
          base = 'https://graph.facebook.com/v24.0'

          def show(label, path, params=None):
              query = dict(params or {})
              query['access_token'] = token
              try:
                  response = requests.get(base + path, params=query, timeout=30)
                  data = response.json()
                  if 'error' in data:
                      error = data['error']
                      safe = {'http': response.status_code, 'code': error.get('code'), 'type': error.get('type'), 'message': error.get('message')}
                  else:
                      safe = data
                  print('DIAGNOSTIC ' + label + ' ' + json.dumps(safe), flush=True)
                  return data
              except Exception as exc:
                  print('DIAGNOSTIC ' + label + ' ' + json.dumps({'error': type(exc).__name__}), flush=True)
                  return {}

          show('page', '/' + page_id, {'fields': 'id,name'})
          debug = show('token_info', '/debug_token', {'input_token': token})
          fields = 'id,created_time,permalink_url,is_published,privacy,status_type'
          for post_id in ('383365871537147_122224141538575004', '383365871537147_122224166342575004'):
              show('post_' + post_id.rsplit('_', 1)[-1], '/' + post_id, {'fields': fields})
          show('recent_posts', '/' + page_id + '/posts', {'limit': 5, 'fields': fields})
          show('recent_photos', '/' + page_id + '/photos', {'limit': 5, 'fields': 'id,created_time,link'})
          app_id = debug.get('data', {}).get('app_id')
          if app_id:
              show('app_info', '/' + str(app_id), {'fields': 'id,name,mode'})
          PY
